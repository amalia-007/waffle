<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Belgian Waffles — Kalgoorlie, WA</title>
  <meta name="description" content="Authentic Belgian waffles served from a food truck in Kalgoorlie, Western Australia. From the heart of Belgium, straight to the Goldfields." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..500;9..40,600;9..40,700&display=swap" rel="stylesheet" />

  <style>
    /* ─────────────────────────────────────────
       RESET & TOKENS
    ───────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --deep-brown:  #2C1A0E;
      --warm-brown:  #A0522D;
      --cream:       #F5ECD7;
      --gold:        #C8860A;
      --orange:      #E85D04;

      --nav-h: 68px;

      --ff-display: 'Playfair Display', Georgia, serif;
      --ff-body:    'Libre Baskerville', Georgia, serif;
      --ff-ui:      'DM Sans', sans-serif;

      /* Subtle kraft-paper grid lines */
      --grid-line: rgba(200, 134, 10, 0.07);
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--ff-ui);
      background-color: var(--deep-brown);
      color: var(--cream);
      overflow-x: hidden;
      line-height: 1.6;
    }

    img { display: block; max-width: 100%; }
    a   { text-decoration: none; color: inherit; }
    ul  { list-style: none; }
    button { cursor: pointer; border: none; background: none; font: inherit; }

    /* ─────────────────────────────────────────
       UTILITY — SHARED ACROSS ALL SECTIONS
    ───────────────────────────────────────── */
    .container {
      width: 100%;
      max-width: 1120px;
      margin-inline: auto;
      padding-inline: clamp(1.25rem, 4vw, 2.5rem);
    }

    /* Reusable grid-texture mixin via class */
    .tex-grid {
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 44px 44px;
    }

    /* ─────────────────────────────────────────
       SECTION 1 — FIXED NAVIGATION
    ───────────────────────────────────────── */
    #site-nav {
      position: fixed;
      top: 0;
      inset-inline: 0;
      z-index: 900;
      height: var(--nav-h);
      background-color: var(--deep-brown);
      border-bottom: 1px solid rgba(200, 134, 10, 0.18);
      /* Subtle inner shadow to ground it */
      box-shadow: 0 1px 0 rgba(200, 134, 10, 0.06),
                  0 4px 24px rgba(0, 0, 0, 0.35);

      /* Fade-up on load */
      opacity: 0;
      transform: translateY(-8px);
      animation: navFadeIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
    }

    @keyframes navFadeIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 100%;
    }

    /* Logo */
    .nav-logo {
      font-family: var(--ff-display);
      font-weight: 900;
      font-size: clamp(1.1rem, 2.5vw, 1.3rem);
      color: var(--cream);
      letter-spacing: -0.01em;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 0.45em;
      transition: opacity 0.2s;
    }
    .nav-logo:hover { opacity: 0.85; }
    .nav-logo-icon {
      font-size: 1.25em;
      line-height: 1;
    }

    /* Desktop links */
    .nav-links {
      display: flex;
      align-items: center;
      gap: clamp(1.25rem, 3vw, 2rem);
    }

    .nav-links li a {
      font-family: var(--ff-ui);
      font-weight: 500;
      font-size: 0.875rem;
      letter-spacing: 0.025em;
      color: rgba(245, 236, 215, 0.78);
      transition: color 0.2s;
      white-space: nowrap;
    }
    .nav-links li a:hover { color: var(--cream); }

    /* "Book Us" CTA pill */
    .nav-cta {
      display: inline-flex;
      align-items: center;
      gap: 0.35em;
      padding: 0.48em 1.15em;
      background-color: var(--orange);
      color: #fff !important;
      font-weight: 600 !important;
      font-size: 0.875rem;
      border-radius: 6px;
      letter-spacing: 0.02em;
      transition: background-color 0.2s, transform 0.15s, box-shadow 0.2s;
      white-space: nowrap;
    }
    .nav-cta:hover {
      background-color: #cf5203;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(232, 93, 4, 0.38);
    }

    /* ── Hamburger (mobile only) ── */
    .nav-burger {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: flex-end;
      gap: 5px;
      width: 36px;
      height: 36px;
      padding: 4px;
      flex-shrink: 0;
    }

    .nav-burger span {
      display: block;
      height: 2px;
      background-color: var(--cream);
      border-radius: 2px;
      transform-origin: center;
      transition: width 0.25s, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.25s;
    }
    .nav-burger span:nth-child(1) { width: 22px; }
    .nav-burger span:nth-child(2) { width: 28px; }
    .nav-burger span:nth-child(3) { width: 18px; }

    /* Open state */
    .nav-burger[aria-expanded="true"] span:nth-child(1) {
      width: 26px;
      transform: translateY(7px) rotate(45deg);
    }
    .nav-burger[aria-expanded="true"] span:nth-child(2) {
      opacity: 0;
      transform: scaleX(0);
    }
    .nav-burger[aria-expanded="true"] span:nth-child(3) {
      width: 26px;
      transform: translateY(-7px) rotate(-45deg);
    }

    /* Mobile drawer */
    .nav-drawer {
      display: none; /* JS toggles this */
      position: fixed;
      top: var(--nav-h);
      inset-inline: 0;
      z-index: 890;
      background-color: var(--deep-brown);
      border-bottom: 1px solid rgba(200, 134, 10, 0.18);
      padding: 1.25rem clamp(1.25rem, 4vw, 2.5rem) 1.75rem;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);

      /* Slide-down animation when shown */
      animation: drawerSlide 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes drawerSlide {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .nav-drawer ul {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .nav-drawer li a {
      display: block;
      font-family: var(--ff-ui);
      font-weight: 500;
      font-size: 1rem;
      color: rgba(245, 236, 215, 0.82);
      padding: 0.85rem 0;
      border-bottom: 1px solid rgba(200, 134, 10, 0.12);
      transition: color 0.2s, padding-left 0.2s;
    }
    .nav-drawer li a:hover {
      color: var(--cream);
      padding-left: 0.35rem;
    }
    .nav-drawer li:last-child a {
      margin-top: 1rem;
      border-bottom: none;
      display: inline-flex;
      padding: 0.6em 1.5em;
      background-color: var(--orange);
      color: #fff;
      font-weight: 600;
      border-radius: 6px;
    }
    .nav-drawer li:last-child a:hover {
      background-color: #cf5203;
      padding-left: 1.5em;
    }

    /* ─────────────────────────────────────────
       SECTION 2 — HERO
    ───────────────────────────────────────── */
    #hero {
      position: relative;
      min-height: 100svh; /* safe-viewport for mobile bars */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding-top: var(--nav-h);
      background-color: var(--deep-brown);
    }

    /* Grid texture layer */
    #hero-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(200, 134, 10, 0.065) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200, 134, 10, 0.065) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
    }

    /* Radial warm glow */
    #hero-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse 72% 68% at 50% 52%,
        rgba(160, 82, 45, 0.22) 0%,
        rgba(200, 134, 10, 0.08) 45%,
        transparent 75%
      );
      pointer-events: none;
    }

    /* Vignette edges */
    #hero-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse 100% 100% at 50% 50%,
        transparent 55%,
        rgba(15, 8, 2, 0.55) 100%
      );
      pointer-events: none;
    }

    /* Content block */
    .hero-body {
      position: relative;
      z-index: 2;
      text-align: center;
      padding-inline: clamp(1.25rem, 5vw, 3rem);
      max-width: 860px;

      /* Fade-up entrance */
      opacity: 0;
      transform: translateY(28px);
      animation: heroFadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards;
    }

    @keyframes heroFadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Eyebrow label */
    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.5em;
      font-family: var(--ff-ui);
      font-weight: 600;
      font-size: clamp(0.7rem, 1.4vw, 0.8rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: clamp(0.9rem, 2vw, 1.4rem);

      /* Slightly delayed */
      opacity: 0;
      animation: heroFadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.55s forwards;
    }
    .hero-eyebrow-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background-color: var(--orange);
      flex-shrink: 0;
    }

    /* Main headline */
    .hero-headline {
      font-family: var(--ff-display);
      font-weight: 900;
      font-size: clamp(3.2rem, 9vw, 7.5rem);
      line-height: 0.95;
      letter-spacing: -0.03em;
      color: var(--cream);
      margin-bottom: clamp(1.1rem, 2.5vw, 1.75rem);

      /* Staggered fade */
      opacity: 0;
      animation: heroFadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.45s forwards;
    }
    .hero-headline em {
      /* Italic accent on "Waffles" */
      font-style: italic;
      color: var(--gold);
    }

    /* Subheading */
    .hero-sub {
      font-family: var(--ff-body);
      font-style: italic;
      font-weight: 400;
      font-size: clamp(1rem, 2.2vw, 1.3rem);
      color: rgba(245, 236, 215, 0.68);
      line-height: 1.65;
      max-width: 520px;
      margin-inline: auto;
      margin-bottom: clamp(2rem, 4vw, 3rem);

      opacity: 0;
      animation: heroFadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.6s forwards;
    }

    /* CTA buttons row */
    .hero-ctas {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
      justify-content: center;

      opacity: 0;
      animation: heroFadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.75s forwards;
    }

    /* Primary button */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.45em;
      padding: 0.82em 1.8em;
      background-color: var(--orange);
      color: #fff;
      font-family: var(--ff-ui);
      font-weight: 600;
      font-size: clamp(0.875rem, 1.6vw, 1rem);
      letter-spacing: 0.02em;
      border-radius: 8px;
      border: 2px solid transparent;
      transition: background-color 0.2s, transform 0.18s, box-shadow 0.2s;
      white-space: nowrap;
    }
    .btn-primary:hover {
      background-color: #cf5203;
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(232, 93, 4, 0.42);
    }
    .btn-primary:active { transform: translateY(0); }

    /* Ghost / outline button */
    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 0.45em;
      padding: 0.82em 1.8em;
      background-color: transparent;
      color: var(--cream);
      font-family: var(--ff-ui);
      font-weight: 600;
      font-size: clamp(0.875rem, 1.6vw, 1rem);
      letter-spacing: 0.02em;
      border-radius: 8px;
      border: 2px solid rgba(245, 236, 215, 0.28);
      transition: border-color 0.2s, background-color 0.2s, transform 0.18s;
      white-space: nowrap;
    }
    .btn-ghost:hover {
      border-color: rgba(245, 236, 215, 0.65);
      background-color: rgba(245, 236, 215, 0.06);
      transform: translateY(-2px);
    }
    .btn-ghost:active { transform: translateY(0); }

    /* ── Scroll indicator ── */
    .hero-scroll {
      position: absolute;
      bottom: clamp(1.5rem, 3.5vw, 2.5rem);
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;

      opacity: 0;
      animation: heroFadeUp 0.6s ease 1.1s forwards;
    }

    .hero-scroll-label {
      font-family: var(--ff-ui);
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(245, 236, 215, 0.38);
    }

    /* Bouncing chevron */
    .hero-scroll-chevron {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      animation: scrollBounce 2s ease-in-out 1.4s infinite;
    }

    .hero-scroll-chevron span {
      display: block;
      width: 10px;
      height: 10px;
      border-right: 2px solid rgba(200, 134, 10, 0.55);
      border-bottom: 2px solid rgba(200, 134, 10, 0.55);
      transform: rotate(45deg);
      border-radius: 1px;
    }
    .hero-scroll-chevron span:nth-child(2) {
      opacity: 0.5;
      margin-top: -4px;
    }

    @keyframes scrollBounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(6px); }
    }

    /* ─────────────────────────────────────────
       RESPONSIVE BREAKPOINTS
    ───────────────────────────────────────── */
    @media (max-width: 768px) {
      .nav-links  { display: none; }
      .nav-burger { display: flex; }
    }

    @media (max-width: 480px) {
      .hero-ctas { flex-direction: column; align-items: center; }
      .btn-primary,
      .btn-ghost  { width: 100%; max-width: 320px; justify-content: center; }
    }

    /* ─────────────────────────────────────────
       PLACEHOLDER — future sections mount below
    ───────────────────────────────────────── */
    /* (sections 3-8 will be inserted here) */

  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════
       SECTION 1 · NAVIGATION
  ══════════════════════════════════════════ -->
  <nav id="site-nav" role="navigation" aria-label="Main navigation">
    <div class="container nav-inner">

      <!-- Logo -->
      <a href="#hero" class="nav-logo" aria-label="Belgian Waffles — home">
        <span class="nav-logo-icon" aria-hidden="true">🧇</span>
        Belgian Waffles
      </a>

      <!-- Desktop links -->
      <ul class="nav-links" role="list">
        <li><a href="#find-us">Find Us</a></li>
        <li><a href="#menu">Menu</a></li>
        <li><a href="#gallery">Gallery</a></li>
        <li><a href="#reviews">Reviews</a></li>
        <li><a href="#booking"><span class="nav-cta">Book Us</span></a></li>
      </ul>

      <!-- Hamburger button (mobile) -->
      <button
        class="nav-burger"
        id="nav-burger"
        aria-controls="nav-drawer"
        aria-expanded="false"
        aria-label="Open menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>
  </nav>

  <!-- Mobile drawer -->
  <div id="nav-drawer" class="nav-drawer" role="dialog" aria-modal="false" aria-label="Mobile menu" hidden>
    <ul role="list">
      <li><a href="#find-us"  data-drawer-link>Find Us</a></li>
      <li><a href="#menu"     data-drawer-link>Menu</a></li>
      <li><a href="#gallery"  data-drawer-link>Gallery</a></li>
      <li><a href="#reviews"  data-drawer-link>Reviews</a></li>
      <li><a href="#booking"  data-drawer-link>Book Us</a></li>
    </ul>
  </div>


  <!-- ═══════════════════════════════════════
       SECTION 2 · HERO
  ══════════════════════════════════════════ -->
  <section id="hero" aria-label="Hero">

    <!-- Background layers -->
    <div id="hero-grid"     aria-hidden="true"></div>
    <div id="hero-glow"     aria-hidden="true"></div>
    <div id="hero-vignette" aria-hidden="true"></div>

    <!-- Main content -->
    <div class="hero-body">

      <p class="hero-eyebrow" aria-label="Location">
        <span class="hero-eyebrow-dot" aria-hidden="true"></span>
        Kalgoorlie · Western Australia
        <span class="hero-eyebrow-dot" aria-hidden="true"></span>
      </p>

      <h1 class="hero-headline">
        Real Belgian<br><em>Waffles</em>
      </h1>

      <p class="hero-sub">
        From the heart of Belgium, straight to the&nbsp;Goldfields.
      </p>

      <div class="hero-ctas">
        <a href="#find-us" class="btn-primary">
          <span aria-hidden="true">📍</span>
          Find Us This Weekend
        </a>
        <a href="#booking" class="btn-ghost">
          Book Your Event
        </a>
      </div>

    </div>

    <!-- Scroll indicator -->
    <div class="hero-scroll" aria-hidden="true">
      <span class="hero-scroll-label">Scroll</span>
      <div class="hero-scroll-chevron">
        <span></span>
        <span></span>
      </div>
    </div>

  </section>


  <!-- ═══════════════════════════════════════
       SECTIONS 3–8 WILL BE ADDED BELOW
  ══════════════════════════════════════════ -->


  <!-- ─────────────────────────────────────
       JAVASCRIPT
  ───────────────────────────────────────── -->
  <script>
    (function () {
      'use strict';

      /* ── Hamburger / drawer toggle ── */
      const burger = document.getElementById('nav-burger');
      const drawer = document.getElementById('nav-drawer');

      function openDrawer() {
        drawer.hidden = false;
        drawer.style.display = 'block';
        burger.setAttribute('aria-expanded', 'true');
        burger.setAttribute('aria-label', 'Close menu');
        document.body.style.overflow = 'hidden';
      }

      function closeDrawer() {
        drawer.hidden = true;
        drawer.style.display = 'none';
        burger.setAttribute('aria-expanded', 'false');
        burger.setAttribute('aria-label', 'Open menu');
        document.body.style.overflow = '';
      }

      burger.addEventListener('click', () => {
        const isOpen = burger.getAttribute('aria-expanded') === 'true';
        isOpen ? closeDrawer() : openDrawer();
      });

      /* Close on any drawer link tap */
      drawer.querySelectorAll('[data-drawer-link]').forEach(link => {
        link.addEventListener('click', closeDrawer);
      });

      /* Close on Escape */
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && burger.getAttribute('aria-expanded') === 'true') {
          closeDrawer();
          burger.focus();
        }
      });

      /* Close drawer on resize past mobile breakpoint */
      const mq = window.matchMedia('(min-width: 769px)');
      mq.addEventListener('change', e => { if (e.matches) closeDrawer(); });

      /* ── Subtle nav background intensify on scroll ── */
      const nav = document.getElementById('site-nav');
      const onScroll = () => {
        if (window.scrollY > 24) {
          nav.style.borderBottomColor = 'rgba(200, 134, 10, 0.28)';
          nav.style.boxShadow = '0 1px 0 rgba(200,134,10,0.08), 0 6px 32px rgba(0,0,0,0.5)';
        } else {
          nav.style.borderBottomColor = '';
          nav.style.boxShadow = '';
        }
      };
      window.addEventListener('scroll', onScroll, { passive: true });

    }());
  </script>

</body>
</html>
